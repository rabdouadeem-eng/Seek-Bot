<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔍 Seek Bot - Dashboard</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #0E1116; color: #E6EDF3; padding: 16px; }
        .container { max-width: 1200px; margin: 0 auto; }
        .card { background: #161B22; border: 1px solid #262C36; border-radius: 16px; padding: 16px; margin-bottom: 16px; }
        h1 { color: #FBBF24; margin-bottom: 12px; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 12px; }
        .stat { background: #0E1116; padding: 12px; border-radius: 12px; border: 1px solid #262C36; text-align: center; }
        .stat .label { font-size: 11px; color: #8B949E; text-transform: uppercase; }
        .stat .value { font-size: 20px; font-weight: 700; margin-top: 4px; }
        .green { color: #2EA043; } .red { color: #DA3633; } .gold { color: #FBBF24; } .blue { color: #58A6FF; }
        .signal { background: #0E1116; border: 1px solid #262C36; border-radius: 10px; padding: 12px; margin-bottom: 8px; }
        .signal .header { display: flex; justify-content: space-between; flex-wrap: wrap; }
        .badge { display: inline-block; padding: 2px 10px; border-radius: 12px; font-weight: 700; font-size: 13px; }
        .badge-buy { background: #2EA043; color: #fff; }
        .badge-sell { background: #DA3633; color: #fff; }
        .badge-hold { background: #262C36; color: #8B949E; }
        .reason { font-size: 12px; color: #8B949E; margin-top: 6px; padding: 6px; background: #161B22; border-radius: 6px; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        th, td { padding: 6px 8px; border-bottom: 1px solid #1C2128; text-align: right; }
        th { color: #8B949E; }
        .empty { text-align: center; color: #8B949E; padding: 20px; }
        .footer { text-align: center; color: #8B949E; font-size: 12px; margin-top: 16px; border-top: 1px solid #262C36; padding-top: 12px; }
    </style>
</head>
<body>
<div class="container">
    <h1>🔍 Seek Bot <span style="color:#8B949E; font-size:16px;">داشبورد</span></h1>

    <!-- الإحصائيات -->
    <div class="card">
        <div class="stats-grid" id="stats">
            <div class="stat"><div class="label">💰 الرصيد</div><div class="value gold" id="balance">--</div></div>
            <div class="stat"><div class="label">📈 الربح</div><div class="value" id="pnl">--</div></div>
            <div class="stat"><div class="label">✅ ربح</div><div class="value green" id="wins">--</div></div>
            <div class="stat"><div class="label">❌ خسارة</div><div class="value red" id="losses">--</div></div>
            <div class="stat"><div class="label">🎯 النجاح</div><div class="value blue" id="winRate">--</div></div>
            <div class="stat"><div class="label">📊 مفتوحة</div><div class="value" id="openPos" style="color:#FBBF24;">--</div></div>
        </div>
    </div>

    <!-- الإشارات -->
    <div class="card">
        <h3>📈 الإشارات الحية</h3>
        <div id="signals"><div class="empty">⏳ جاري التحميل...</div></div>
    </div>

    <!-- السجل -->
    <div class="card">
        <h3>📋 سجل الصفقات</h3>
        <div id="trades"><div class="empty">⏳ جاري التحميل...</div></div>
    </div>

    <div class="footer">⚡ تحديث تلقائي كل 15 ثانية · جميع الصفقات وهمية</div>
</div>

<script>
    // يستخدم الرابط الحالي (نسبي) – يعمل إذا كان الملف في نفس النطاق
    const API_BASE = '';

    async function fetchStatus() {
        try {
            const r = await fetch('/status');
            const d = await r.json();
            document.getElementById('balance').textContent = '$' + d.balance.toFixed(2);
            const pnl = document.getElementById('pnl');
            pnl.textContent = '$' + d.total_pnl.toFixed(2);
            pnl.className = 'value ' + (d.total_pnl >= 0 ? 'green' : 'red');
            document.getElementById('wins').textContent = d.wins || 0;
            document.getElementById('losses').textContent = d.losses || 0;
            document.getElementById('winRate').textContent = (d.win_rate || 0).toFixed(1) + '%';
            document.getElementById('openPos').textContent = d.open_positions || 0;
        } catch(e) { console.error('Status error:', e); }
    }

    async function fetchSignals() {
        try {
            const r = await fetch('/signals/all');
            const data = await r.json();
            const container = document.getElementById('signals');
            if (!data || Object.keys(data).length === 0) {
                container.innerHTML = '<div class="empty">لا توجد إشارات</div>';
                return;
            }
            let html = '';
            for (const [symbol, sig] of Object.entries(data)) {
                const type = sig.type || 'HOLD';
                const cls = type === 'BUY' ? 'badge-buy' : (type === 'SELL' ? 'badge-sell' : 'badge-hold');
                const conf = sig.confidence ? (sig.confidence * 100).toFixed(0) : '0';
                const price = sig.entry || '--';
                const reason = sig.reason || 'لا يوجد سبب';
                html += `
                    <div class="signal">
                        <div class="header">
                            <div><span class="badge ${cls}">${type}</span> <strong>${symbol}</strong> <span style="color:#8B949E;font-size:13px;">ثقة ${conf}%</span></div>
                            <div>💰 ${price}</div>
                        </div>
                        <div class="reason">📝 ${reason}</div>
                    </div>
                `;
            }
            container.innerHTML = html;
        } catch(e) { console.error('Signals error:', e); }
    }

    async function fetchTrades() {
        try {
            const r = await fetch('/trades');
            const data = await r.json();
            const container = document.getElementById('trades');
            const history = data.history || [];
            if (history.length === 0) {
                container.innerHTML = '<div class="empty">📭 لا توجد صفقات</div>';
                return;
            }
            let html = `<table><thead><tr><th>الزوج</th><th>اتجاه</th><th>الدخول</th><th>TP</th><th>SL</th><th>الربح</th></tr></thead><tbody>`;
            history.slice(-8).reverse().forEach(t => {
                const p = t.profit || 0;
                const cls = p >= 0 ? 'green' : 'red';
                html += `<tr><td><b>${t.symbol}</b></td><td>${t.side}</td><td>${t.entry}</td><td>${t.tp || '--'}</td><td>${t.sl || '--'}</td><td class="${cls}">${p.toFixed(2)}</td></tr>`;
            });
            html += '</tbody></table>';
            container.innerHTML = html;
        } catch(e) { console.error('Trades error:', e); }
    }

    function refresh() { fetchStatus(); fetchSignals(); fetchTrades(); }
    refresh();
    setInterval(refresh, 15000);
</script>
</body>
</html>
